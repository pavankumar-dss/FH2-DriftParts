; Drift Parts. Read when the game starts; restart the game after changing anything.
; Delete this file to go back to the defaults below.

[Tires]
; The stock compound the drift tire is copied from: 5 Street, 6 Sport, 7 Race.
BaseCompound=5
; How much of the grip lost past the tire's peak is kept. 1 = the stock tire, 0 = no loss at all.
; Lower = the car holds a slide more easily and with more angle, and is easier to catch.
SideFalloff=0.4
PowerFalloff=0.5
; Grip overall, sideways and under power. 1 = the stock tire's.
; Lower PowerGrip = the rear breaks loose with less power.
SideGrip=1.0
PowerGrip=1.0
Price=3000

[Suspension]
; The game's parts all have 5.0.
Caster=7.0
; Degrees; negative leans the top of the wheel in.
FrontCamber=-3.0
RearCamber=-1.0
; The softest spring the Tune page allows, against the Race suspension's softest.
SoftestSpringScale=0.5
; How much lower (metres) the Tune page lets the car go.
RideHeightDrop=0.015
Price=2500

[AngleKit]
; The Drift Angle Kit: a front anti-roll bar (a copy of the car's Race bar) that also gives the car
; more steering lock.
; Stock cars steer to 42 degrees, and to 29 on a controller or keys.
; MaxAngle is the lock a car gets with the kit until you set its own on the Tuning screen (Alignment
; > Steering lock, 30 to 80; those are kept in DriftParts.locks.ini). On a controller or keys the
; lock keeps MaxAnglePad's ratio to it.
MaxAngle=60
MaxAnglePad=50
; How quickly the wheels turn, in degrees a second (stock 105): towards a turn, and back the other way
; (countersteer: catching a slide and switching sides). 0 keeps the car's own.
TurnRate=0
CountersteerRate=150
Price=2000

[Transmission]
; The Drift Transmission: your car's Race gearbox made into a 4-speed, like the newer games' drift
; gearbox. First and top gear cover the Race gearbox's range (so top speed stays) and the gears
; between are evenly spaced (every upshift drops the revs by the same share).
; Forward gears: 3 to 8. 0 = as many as the car's Race gearbox but at least 5, closer together
; (0.3.0's Drift Transmission).
Gears=4
; First and top gear (gear x final drive) against the Race gearbox's. Lower = taller.
; 0.85: first gear 15% taller, so it's usable mid-slide and spins up less eagerly.
FirstGearScale=0.85
; 1.1: top gear 10% shorter (the final drive goes up by this), more revs everywhere, less top speed.
TopGearScale=1.1
; Seconds per shift; 0 = the Race gearbox's.
ShiftTime=0
Price=2500

[Differential]
; The Drift Differential: your car's Race diff with the driven wheels locked together hard.
; Percent, as the Tune page shows them: under power (Accel) and off the throttle (Decel).
; The rear on rear- and four-wheel drive, the front on front-wheel drive.
Accel=100
Decel=50
; Four-wheel drive only: the front diff, and the share of the torque that goes to the rear
; (0.01 to 0.99; a car that already sends more keeps its own).
FrontAccel=25
FrontDecel=0
RearSplit=0.8
Price=2250
